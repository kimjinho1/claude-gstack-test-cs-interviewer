services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    volumes:
      - ../docs:/app/docs:ro
      - storage_data:/app/storage
    environment:
      - DOCS_PATH=/app/docs
      - DATABASE_URL=sqlite:////app/storage/trainer.db
    env_file:
      - path: .env
        required: false
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5175:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  storage_data:
