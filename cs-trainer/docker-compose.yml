services:
  backend:
    build:
      context: ..
      dockerfile: cs-trainer/Dockerfile.backend
    volumes:
      - storage_data:/app/storage
    environment:
      - DOCS_PATH=/app/docs
      - DATABASE_URL=sqlite:////app/storage/trainer.db
    ports:
      - "8001:8001"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    ports:
      - "5174:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  storage_data:
