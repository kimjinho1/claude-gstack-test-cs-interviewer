app = "cs-trainer-api"
primary_region = "nrt"  # Tokyo — 한국에서 제일 가까운 리전

[build]
  dockerfile = "cs-trainer/Dockerfile.backend"
  # build context는 fly deploy 시 CS/ 루트에서 실행

[env]
  DOCS_PATH = "/app/docs"
  DATABASE_URL = "sqlite:////app/storage/trainer.db"

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "storage_data"
  destination = "/app/storage"
