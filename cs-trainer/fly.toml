# fly.toml app configuration file generated for cs-trainer-api on 2026-03-23T00:30:21+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cs-trainer-api'
primary_region = 'nrt'

[build]
  dockerfile = 'cs-trainer/Dockerfile.backend'

[env]
  DATABASE_URL = 'sqlite:////app/storage/trainer.db'
  DOCS_PATH = '/app/docs'

[[mounts]]
  source = 'storage_data'
  destination = '/app/storage'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
