# fly.toml app configuration file generated for cs-trainer-api on 2026-03-23T00:32:47+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'cs-trainer-api'
primary_region = 'nrt'

[build]
  dockerfile = 'cs-trainer/Dockerfile.backend'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
