app = 'cs-trainer-api'
primary_region = 'nrt'

[build]
  dockerfile = 'cs-trainer/Dockerfile.backend'

# ★ DB 충돌 방지 — 새 배포 전 migration 1회만 실행
# 이전 인스턴스가 트래픽 처리 중일 때 volume에 접근해 migration 완료 후 새 인스턴스 시작
[deploy]
  release_command = 'python -c "from backend.main import _run_migrations; _run_migrations()"'

[env]
  DATABASE_URL = 'sqlite:////app/storage/trainer.db'
  DOCS_PATH = '/app/docs'

# SQLite 데이터 영속성 — volume에 저장
[[mounts]]
  source = 'storage_data'
  destination = '/app/storage'

[http_service]
  internal_port = 8001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = '20s'
    interval = '15s'
    method = 'GET'
    path = '/api/health'
    timeout = '5s'

[[vm]]
  memory = '1gb'
  cpus = 1
