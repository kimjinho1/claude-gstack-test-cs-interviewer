name: Deploy Backend to Fly.io

on:
  push:
    branches:
      - main
    paths:
      - 'cs-trainer/backend/**'
      - 'cs-trainer/Dockerfile.backend'
      - 'docs/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - run: flyctl deploy --dockerfile cs-trainer/Dockerfile.backend --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
